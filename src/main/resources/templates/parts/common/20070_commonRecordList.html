<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="body" class="1000601"
         th:with="tableDefList=${T(com.freedom.remainz_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'tableDefList')},
                  dbRecordList=${T(com.freedom.remainz_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'dbRecordList')},
                  recordRefUri=${T(com.freedom.remainz_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'recordRefUri')[0].URI_PATTERN},
                  recordListUri=${T(com.freedom.remainz_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'recordListUri')[0].URI_PATTERN},
                  limitList=${T(com.freedom.remainz_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'limitList')},
                  tableName=${tableDefList[0].TABLE_NAME},
                  currentLimit=${limit != null} ? ${limit} : '10',
                  currentOffset=${offset != null} ? ${offset} : '0',
                  totalRecordCount=${T(com.freedom.remainz_v2.web.util.HtmlPageItemUtil).findRecords(htmlPage, 'totalRecord')[0]['COUNT(*)']}">
        <!--/* ページング計算用に、文字列で受け渡された各値を数値へ変換しておく */-->
        <div class="p-2"
             th:with="currentLimitInt=${T(java.lang.Integer).parseInt(currentLimit)},
                      currentOffsetInt=${T(java.lang.Integer).parseInt(currentOffset)},
                      totalRecordInt=${T(java.lang.Integer).parseInt(totalRecordCount)},
                      prevOffsetInt=${currentOffsetInt - currentLimitInt < 0 ? 0 : currentOffsetInt - currentLimitInt},
                      nextOffsetInt=${currentOffsetInt + currentLimitInt >= totalRecordInt ? currentOffsetInt : currentOffsetInt + currentLimitInt},
                      lastOffsetInt=${(totalRecordInt - 1) / currentLimitInt * currentLimitInt}">
            <div class="p-2">
                <label>
                    <span class="form-label fw-bold"
                          th:text="${tableDefList[0].TABLE_LOGICAL_NAME + '(' + tableDefList[0].TABLE_NAME + ')'}">table</span><br />
                </label>
            </div>
            <!--/* table-responsiveはtable要素ではなく、それを囲むdiv要素に付与しないと
                   横スクロールが有効にならない(Bootstrapの仕様)ため、scrollAreaの方へ付与する */-->
            <div class="scrollArea table-responsive">
                <table class="table table-bordered table-striped table-hover text-nowrap">
                    <thead class="table-success">
                        <tr>
                            <th class="align-middle px-2 py-0" th:each="def : ${tableDefList}"
                                th:text="${def.FIELD_LOGICAL_NAME}">field</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dbRecord : ${dbRecordList}">
                            <td class="px-2 py-0" th:each="def : ${tableDefList}">
                                <a th:if="${def.FOREIGN_TABLE != null and #strings.length(def.FOREIGN_TABLE) > 0}"
                                   th:href="@{__${recordRefUri}__(tableName=${def.FOREIGN_TABLE},recordId=${dbRecord.get(def.FIELD_NAME)})}"
                                   target="_blank" rel="noopener noreferrer"
                                   th:text="${dbRecord.get(def.FIELD_NAME)}">value</a>
                                <span th:unless="${def.FOREIGN_TABLE != null and #strings.length(def.FOREIGN_TABLE) > 0}"
                                      th:text="${dbRecord.get(def.FIELD_NAME)}">value</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="p-2">
                <span th:if="${lastOffsetInt > 0}">
                    <a class="btn btn-secondary px-2 py-0"
                       th:if="${currentOffsetInt > 0}"
                       th:href="@{__${recordListUri}__(tableName=${tableName},limit=${currentLimit},offset=0)}">最初のページ</a>&nbsp;
                    <a class="btn btn-secondary px-2 py-0"
                       th:if="${currentOffsetInt > 0}"
                       th:href="@{__${recordListUri}__(tableName=${tableName},limit=${currentLimit},offset=${prevOffsetInt})}">前のページ</a>&nbsp;
                    <a class="btn btn-secondary px-2 py-0"
                       th:if="${currentOffsetInt < lastOffsetInt}"
                       th:href="@{__${recordListUri}__(tableName=${tableName},limit=${currentLimit},offset=${nextOffsetInt})}">次のページ</a>&nbsp;
                    <a class="btn btn-secondary px-2 py-0"
                       th:if="${currentOffsetInt < lastOffsetInt}"
                       th:href="@{__${recordListUri}__(tableName=${tableName},limit=${currentLimit},offset=${lastOffsetInt})}">最後のページ</a>&nbsp;
                </span>
                <label><span class="form-label fw-bold"
                             th:text="${totalRecordCount + '件中 ' + (currentOffsetInt + 1) + '～' + (currentOffsetInt + dbRecordList.size()) + '件表示'}">表示件数</span></label>
                <select id="selectLimit" name="limit"
                        th:attr="onchange=|changeLimit('${recordListUri}?tableName=${tableName}&amp;limit=','&amp;offset=${currentOffset}')|">
                    <option th:each="limitInList : ${limitList}" th:value="${limitInList.GNR_VAL}"
                            th:selected="${limitInList.GNR_VAL == currentLimit}"
                            th:text="${limitInList.GNR_VAL} + '件'">10件</option>
                </select>
            </div>
        </div>
        <input type="hidden" name="tableName" th:value="${tableName}">
    </div>
</body>
</html>
